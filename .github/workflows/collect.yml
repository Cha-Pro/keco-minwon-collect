name: collect

on:
  schedule:
    - cron: "7 * * * *"     # 매시 07분(UTC) — KST 기준 매시 16분
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 수집 실행
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python collect.py

      - name: 결과 커밋
        run: |
          git config user.name "collect-bot"
          git config user.email "collect-bot@users.noreply.github.com"
          git add 결과 state
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "collect: $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
